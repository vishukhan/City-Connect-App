    <style>
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-avatar-trigger {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #2563eb;
            object-fit: cover;
            cursor: pointer;
            background: #e2e8f0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .header-avatar-trigger:hover {
            transform: scale(1.05);
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.3);
        }
        .app-drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .app-drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .app-side-drawer {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background: #ffffff;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.15);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .app-drawer-overlay.active .app-side-drawer {
            right: 0;
        }
        .drawer-header {
            padding: 30px 24px 20px;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-bottom: 1px solid #e2e8f0;
            position: relative;
            text-align: center;
        }
        .drawer-close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #64748b;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .drawer-user-dp {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid #2563eb;
            object-fit: cover;
            margin: 0 auto 12px;
        }
        .drawer-user-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
        }
        .drawer-user-email {
            font-size: 0.8rem;
            color: #64748b;
        }
        .drawer-menu-container {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
        }
        .drawer-menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: #334155;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .drawer-menu-item:hover {
            background: #f1f5f9;
            color: #2563eb;
        }
        .drawer-menu-item.logout-action {
            color: #ef4444;
            margin-top: 20px;
            border-top: 1px solid #f1f5f9;
            padding-top: 16px;
        }
    </style>
</head>
<body>

        <header class="main-header">

    <!-- DETAILS FULL PAGE VIEW -->
    <div id="detailsPage" class="full-page" style="display:none;">
        <div class="page-nav">

        </div>
        <div class="page-body">

                </div>
                <div class="action-buttons-group">
                    <a id="detCallBtn" href="" class="primary-btn call-btn-style"><i class="fa fa-phone"></i> Call Now</a>
                    <button id="detOrderBtn" class="primary-btn order-btn-style" onclick="openOrderModal()"><i class="fa fa-shopping-basket"></i> Order Online</button>

    <!-- PROFILE APP SIDE DRAWER -->
    <div id="appDrawerOverlay" class="app-drawer-overlay" onclick="toggleAppDrawer(false)">

<!-- Drawer Header -->
<div class="drawer-header">

    <div id="drawer-user-name" class="drawer-user-name">Vishu</div>
    <div id="drawer-user-email" class="drawer-user-email">vk8080@gmail.com</div>
</div>


            <div class="drawer-menu-container">
                <div class="drawer-menu-item" onclick="toggleAppDrawer(false)">
                    <i class="fa-solid fa-user-gear"></i>
                    <span>User Profile Details</span>
                </div>
                <div class="drawer-menu-item" onclick="toggleAppDrawer(false); openTrackingModal();">
                    <i class="fa-solid fa-clock-history"></i>
                    <span>Order History</span>
                </div>
                <div class="drawer-menu-item logout-action" onclick="triggerLogOut()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Log Out</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ADD SHOP MODAL -->
    <div id="shopModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Add New Shop</h3><button onclick="closeModal()">&times;</button></div>
            <div class="form-body">
                <div class="upload-area" onclick="document.getElementById('imgFile').click()">
                    <i class="fa fa-cloud-upload-alt"></i>
                    <p id="fileName">Shop Main Photo</p>
                    <input type="file" id="imgFile" hidden accept="image/*">
                </div>
                <input type="text" id="regName" placeholder="Shop Name">
                <input type="text" id="regCity" placeholder="City (e.g. Jind)">
                <div class="input-row">
                    <select id="regCat" size="2" class="scroll-select">
                        <option value="kirana" selected>Kirana</option>
                        <option value="medical">Medical</option>
                        <option value="gym">Gym</option>
                    </select>
                    <input type="tel" id="regPhone" placeholder="Phone Number">
                </div>
                <input type="text" id="regMap" placeholder="Google Maps Link (Optional)">
                <input type="password" id="regPin" placeholder="Create Secret PIN">
                <input type="text" id="regAddr" placeholder="Full Address">
                <button id="submitBtn" class="primary-btn" onclick="handleRegistration()">Register Shop</button>
            </div>
        </div>
    </div>

    <!-- ONLINE ORDER MODAL -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>🛍️ Place Online Order</h3><button onclick="closeOrderModal()">&times;</button></div>
            <div class="form-body">
                <input type="text" id="ordName" placeholder="Aapka Naam">
                <input type="tel" id="ordPhone" placeholder="Mobile Number">
                <textarea id="ordAddr" placeholder="Poora Delivery Address" style="height:60px;"></textarea>
                <textarea id="ordItems" placeholder="Samaan ki List" style="height:90px;"></textarea>
                <button class="primary-btn" style="background:#10b981;" onclick="placeOrder()">Confirm Order 🚀</button>
            </div>
        </div>
    </div>

    <!-- LIVE TRACKING STATUS MODAL -->
    <div id="trackingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>📍 Live Tracking Status</h3><button onclick="closeTrackingModal()">&times;</button></div>
            <div id="trackResult"><p style="text-align:center; color:#999;">Loading Tracker...</p></div>
        </div>
    </div>

    <!-- MERCHANT DASHBOARD LOGIN MODAL -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Merchant Dashboard</h3><button onclick="closeEditModal()">&times;</button></div>
            <div id="editFormStep1">
                <input type="tel" id="loginPhone" placeholder="Registered Phone">
                <input type="password" id="loginPin" placeholder="Enter PIN">
                <button class="primary-btn" onclick="verifyMerchant()">Login</button>
            </div>
            <!-- Dynamic Merchant Panel Containers Hook Injection -->
            <div id="editFormStep2" style="display:none; margin-top:15px;">
                <textarea id="itemText" placeholder="Kuch naya stock update karein..." style="width:100%; height:60px; margin-bottom:10px;"></textarea>
                <input type="file" id="itemFile" accept="image/*" style="margin-bottom:10px;">
                <button id="postBtn" class="primary-btn" onclick="postUpdate()">Post Update</button>
                <div id="merchantPostList" style="margin-top:15px; max-height:150px; overflow-y:auto;"></div>
                <div id="merchantOrderList" style="margin-top:15px; max-height:200px; overflow-y:auto;"></div>
            </div>
        </div>
    </div>

    <!-- ADMIN PANEL MODAL -->
       <div id="adminPanel" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; overflow-y:auto;">
        <div class="modal-content" style="background:#fff; margin:10% auto; padding:20px; width:90%; max-width:500px; border-radius:12px; position:relative; text-align:center;">
            <span onclick="closeAdmin()" style="position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer; font-weight:bold;">&times;</span>
            <h2 style="margin-top:0; color:#1e3a8a;"><i class="fa fa-user-shield"></i> Admin Dashboard</h2>
            <hr style="border:0; border-top:1px solid #eee; margin-bottom:15px;">
            
            <div id="pendingList" style="max-height:250px; overflow-y:auto; margin-bottom:20px; border:1px solid #f0f0f0; padding:10px; border-radius:8px; background:#fafafa;">
                </div>

            <div id="adminOrderList" style="max-height:350px; overflow-y:auto; border:1px solid #f0f0f0; padding:10px; border-radius:8px; background:#fafafa;">
                </div>
        </div>
    </div>


    <!-- CORE DEPENDENCY CONFIG FIREBASE IMPORTS -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script>
        // App Instance Configuration Object
        window.firebaseConfig = {
            apiKey: "AIzaSyBqfHQrsQbJcZq5Lc4ZgzEs1BVv1Pd4nsE",
            authDomain: "local-1dea0.firebaseapp.com",
            databaseURL: "https://local-1dea0-default-rtdb.firebaseio.com",
            projectId: "local-1dea0",
            storageBucket: "local-1dea0.firebasestorage.app",
            messagingSenderId: "67361178496",
            appId: "1:67361178496:web:3b8ca5f96a6c9ca5fa3765",
            measurementId: "G-5394SPE8D8"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(window.firebaseConfig);
        }

        // Global Variable Mapping Layer
        window.database = firebase.database();
        window.db = firebase.database(); 
        window.coreDb = firebase.firestore();
        window.currentCategory = "all"; 

        // Core View Triggers 
        function toggleAppDrawer(open) {
            const overlay = document.getElementById("appDrawerOverlay");
            if (overlay) {
                if (open) overlay.classList.add("active");
                else overlay.classList.remove("active");
            }
        }

        // Auth Monitor Interface Handler
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.coreDb.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById("user-header-avatar").src = data.profilePic || "https://ui-avatars.com/api/?name=User";
                        document.getElementById("drawer-user-avatar").src = data.profilePic || "https://ui-avatars.com/api/?name=User";
                        document.getElementById("drawer-user-name").innerText = data.name || "User";
                        document.getElementById("drawer-user-email").innerText = data.email || user.email;
                    }
                }).catch(e => console.log("Firestore error:", e));

                setTimeout(() => {
                    if (typeof loadShops === "function") {
                        loadShops();
                    }
                }, 400);
            } else {
                window.location.href = "login.html";
            }
        });

        function triggerLogOut() {
            firebase.auth().signOut().then(() => { window.location.href = "login.html"; });
        }
    </script>

    <!-- External Business Logic Integration File -->
    <script src="script.js"></script>
</body>
